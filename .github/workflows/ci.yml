name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  source-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/check_source_lines.py
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: recordatorios_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d recordatorios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATION_DATABASE_URL: postgresql://test:test@localhost:5432/recordatorios_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/recordatorios_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
        working-directory: api
      - run: uv run --frozen alembic upgrade head
        working-directory: api
      - run: uv run --frozen alembic check
        working-directory: api
      - run: uv run --frozen ruff format --check app tests scripts alembic/env.py alembic/versions/0002_auth.py alembic/versions/0003_reminders.py alembic/versions/0004_whatsapp_delivery.py alembic/versions/0005_account_tokens.py
        working-directory: api
      - run: uv run --frozen ruff check app tests scripts alembic/env.py alembic/versions/0002_auth.py alembic/versions/0003_reminders.py alembic/versions/0004_whatsapp_delivery.py alembic/versions/0005_account_tokens.py
        working-directory: api
      - run: uv run --frozen pyright
        working-directory: api
      - run: uv run --frozen python -m pytest -q
        working-directory: api
      - run: uv run --frozen python -m scripts.export_openapi
        working-directory: api
      - run: git diff --exit-code -- api/openapi.json
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recordatorios/web api:generate
      - run: git diff --exit-code -- web/src/lib/api-types.ts
      - run: pnpm --filter @recordatorios/web format:check
      - run: pnpm --filter @recordatorios/web lint
      - run: pnpm --filter @recordatorios/web typecheck
      - run: pnpm --filter @recordatorios/web test
      - run: pnpm --filter @recordatorios/web build
      - run: pnpm --filter @recordatorios/web exec playwright install chromium
      - run: uv run --frozen python -m scripts.run_auth_e2e
        working-directory: api
  whatsapp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: recordatorios_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d recordatorios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATION_DATABASE_URL: postgresql://test:test@localhost:5432/recordatorios_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/recordatorios_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
        working-directory: api
      - run: uv run --frozen alembic upgrade head
        working-directory: api
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recordatorios/whatsapp typecheck
      - run: pnpm --filter @recordatorios/whatsapp test
      - run: pnpm --filter @recordatorios/whatsapp build
