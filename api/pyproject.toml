[project]
name = "recordatorios-api"
version = "0.1.0"
description = "Migraciones y backend del MVP de recordatorios"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false
