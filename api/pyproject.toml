[project]
name = "recordatorios-api"
version = "0.3.0"
description = "Migraciones y backend del MVP de recordatorios"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic>=2,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "strict"
include = ["app"]

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
]
