services:
  - type: web
    name: recordatorios-whatsapp
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm install -g pnpm@11.19.0 && pnpm install --frozen-lockfile && pnpm --filter @recordatorios/whatsapp build
    startCommand: pnpm --filter @recordatorios/whatsapp start
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - package.json
        - pnpm-workspace.yaml
        - pnpm-lock.yaml
        - whatsapp/**
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: DATABASE_URL
        sync: false
      - key: BAILEYS_ENCRYPTION_KEY
        sync: false
      - key: WHATSAPP_SERVICE_TOKEN
        sync: false
  - type: web
    name: recordatorios-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: api
    autoDeployTrigger: checksPass
    buildCommand: pip install uv==0.12.23 && uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - api/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_KID
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: ACCOUNT_EMAIL_ENABLED
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: WEB_BASE_URL
        value: https://recordatorios-web-one.vercel.app
      - key: WHATSAPP_ENABLED
        value: 'true'
      - key: WHATSAPP_PHONE_KEY
        sync: false
  - type: web
    name: recordatorios-worker
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: api
    autoDeployTrigger: checksPass
    buildCommand: pip install uv==0.12.23 && uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-dev uvicorn app.worker_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - api/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: WORKER_POLL_SECONDS
        value: '10'
      - key: WHATSAPP_ENABLED
        value: 'true'
      - key: WHATSAPP_PHONE_KEY
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_SERVICE_TOKEN
        sync: false
